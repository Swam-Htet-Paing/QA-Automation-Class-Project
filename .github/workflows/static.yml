name: Run Jest Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Initialize a minimal package.json & install Jest dynamically
      - name: Install Jest
        run: |
          npm init -y
          npm install jest

      # Step 4: Execute Jest on your test file
      - name: Run Jest tests
        run: npx jest auth.test.js
